name: Build and Deploy nginx-demo

on:
  push:
    paths:
      - "nginx-demo/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build Docker image
      run: |
        cd nginx-demo
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx-demo:${{ github.sha }} .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx-demo:${{ github.sha }}

    - name: Update deployment.yaml with new image
      run: |
        sed -i "s|image: .*|image: ${{ secrets.DOCKERHUB_USERNAME }}/nginx-demo:${{ github.sha }}|" nginx-demo/deployment.yaml

    - name: Commit updated deployment.yaml
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "GitHub Actions"
        git add nginx-demo/deployment.yaml
        git commit -m "Update image to ${{ github.sha }}"
        git push
